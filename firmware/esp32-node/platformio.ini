; Darknet Sentinel Nexus - ESP32 status node / telemetry node.
; Build:   pio run -e esp32dev          (or -e esp32dev_ble for the BLE status service)
; Flash:   pio run -e esp32dev -t upload && pio device monitor
; Tests:   pio test -e native           (portable security logic, runs on the host)

[platformio]
default_envs = esp32dev

[common]
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
  -Wall
  -Wextra

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
  ${common.lib_deps}
  knolleary/PubSubClient@2.8
build_flags =
  ${common.build_flags}
  -DMQTT_MAX_PACKET_SIZE=1024
  ; RGB LED pins (common cathode by default; add -DDSN_LED_COMMON_ANODE=1 if needed)
  -DDSN_PIN_R=25
  -DDSN_PIN_G=26
  -DDSN_PIN_B=27
  ; Hold this pin LOW at boot to enter serial provisioning (BOOT button on most boards)
  -DDSN_PIN_PROVISION=0

[env:esp32dev_ble]
extends = env:esp32dev
; WiFi + TLS + Bluedroid exceed the default 1.25 MB app slot; no OTA, so use 3 MB.
board_build.partitions = huge_app.csv
build_flags =
  ${env:esp32dev.build_flags}
  -DDSN_ENABLE_BLE=1

[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DDSN_NATIVE=1
