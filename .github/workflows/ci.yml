name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/ci-throwaway-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-throwaway-password 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DSN_TEST_NEO4J_URI: bolt://localhost:7687
      DSN_TEST_NEO4J_USER: neo4j
      DSN_TEST_NEO4J_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: ruff
        run: |
          uv run ruff check . ../api
          uv run ruff format --check . ../api
      - name: requirements.txt in sync with uv.lock (Vercel)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q -o ../requirements.txt
          git diff --exit-code ../requirements.txt
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest (coverage gate 80%)
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate docker-compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet

  demo:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - run: make demo-phase0
      - run: make demo-phase1
      - run: make demo-phase2
      - run: make demo-phase3
