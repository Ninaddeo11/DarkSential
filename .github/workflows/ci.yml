name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/ci-throwaway-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-throwaway-password 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DSN_TEST_NEO4J_URI: bolt://localhost:7687
      DSN_TEST_NEO4J_USER: neo4j
      DSN_TEST_NEO4J_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: requirements.txt in sync with uv.lock (Vercel backend service)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q -o requirements.txt
          git diff --exit-code requirements.txt
      - name: mypy (strict)
        run: uv run mypy
      - name: event types shared with the frontend are up to date
        run: uv run python ../scripts/gen_event_types.py --check
      - name: pytest (coverage gate 80%)
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate docker-compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet
          docker compose --env-file .env -f infra/docker-compose.yml \
            -f infra/docker-compose.lab.yml config --quiet
          docker compose --env-file .env -f infra/docker-compose.yml \
            -f infra/docker-compose.gateway.yml config --quiet
      - name: shell scripts parse
        run: for f in infra/lab/*.sh infra/mosquitto/entrypoint.sh; do sh -n "$f"; done

  enforcement:
    # Driver tests against REAL nftables, in a container with only CAP_NET_ADMIN.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:0.12.17-python3.13-trixie-slim
      options: --cap-add=NET_ADMIN
    env:
      DSN_TEST_NFT: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update -qq && apt-get install -y -qq nftables
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q -p no:cacheprovider tests/test_response_drivers.py

  iot:
    # Real Mosquitto: TLS, provisioned passwords, ACLs, broker log -> behavior rules.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - name: provision broker PKI + credentials
        run: |
          uv run python ../scripts/mqtt_provision.py --out data/mqtt-it --host localhost \
            --device esp32-node --device rogue-sensor --no-device-files
          mkdir -p data/mqtt-it/log
      - name: start mosquitto
        run: |
          M="$GITHUB_WORKSPACE/infra/mosquitto"; W="$PWD/data/mqtt-it"
          # LOG_READER_GID: let the (non-root) runner read the broker log.
          docker run -d --name mosq -p 8883:8883 --entrypoint /bin/sh -e LOG_READER_GID="$(id -g)" \
            -v "$M/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            -v "$M/entrypoint.sh:/entrypoint.sh:ro" -v "$M/config/acl:/mosquitto/src/acl:ro" \
            -v "$W/passwd:/mosquitto/src/passwd:ro" -v "$W/certs:/mosquitto/src/certs:ro" \
            -v "$W/log:/mosquitto/log" eclipse-mosquitto:2.0.22 /entrypoint.sh
          for i in $(seq 1 30); do nc -z localhost 8883 && break; sleep 1; done
      - name: integration tests
        env:
          DSN_TEST_MQTT_DIR: data/mqtt-it
          DSN_TEST_MQTT_HOST: localhost
          DSN_TEST_MQTT_PORT: "8883"
          DSN_TEST_MQTT_LOG: data/mqtt-it/log/mosquitto.log
        run: uv run pytest -q -p no:cacheprovider tests/test_mqtt_integration.py
      - if: always()
        run: docker logs mosq | tail -20

  lab:
    # The virtual IoT lab end to end: real broker, gateway capture, nmap, intel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: "3.13"
      - run: uv sync --frozen --extra lab
        working-directory: backend
      - run: python scripts/tasks.py lab-up
      - run: python scripts/lab_smoke.py
      - if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml \
            -f infra/docker-compose.lab.yml logs --tail 60 backend mosquitto plug-lab sensor-gate
      - if: always()
        run: python scripts/tasks.py lab-down

  demo:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only
        with:
          version: "0.12.17"
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - run: make demo-phase0
      - run: make demo-phase1
      - run: make demo-phase2
      - run: make demo-phase3
      - run: make demo-phase4
      - run: make demo-phase5
