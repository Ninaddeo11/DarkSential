# Darknet Sentinel Nexus - local lab stack.
# Run from the repo root so .env is used for interpolation:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# All published ports bind to 127.0.0.1 only.
name: dsn

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    # Installs secrets with mosquitto-only permissions, then starts the broker.
    # Fails closed (won't start) until `make setup` / scripts/mqtt_provision.py ran.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - ./mosquitto/config/acl:/mosquitto/src/acl:ro
      - ./mosquitto/passwd:/mosquitto/src/passwd:ro
      - ./mosquitto/certs:/mosquitto/src/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      # TLS only. Bind to the lab-facing interface so ESP32 nodes can reach it
      # (DSN_MQTT_BIND=192.168.50.2); localhost by default.
      - "${DSN_MQTT_BIND:-127.0.0.1}:8883:8883"
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8883 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.31-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH in .env}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:${DSN_NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${DSN_NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DSN_API_HOST: 0.0.0.0
      DSN_DATABASE_URL: sqlite:////srv/data/dsn.sqlite3
      DSN_FIXTURES_DIR: /srv/fixtures
      DSN_CACHE_DIR: /srv/data/cache
      DSN_NEO4J_URI: bolt://neo4j:7687
      DSN_MODELS_DIR: /srv/data/models
      DSN_MQTT_HOST: mosquitto
      DSN_MQTT_PORT: 8883
      DSN_MQTT_USERNAME: dsn-backend
      DSN_MQTT_CA_FILE: /srv/mqtt-ca.crt
      DSN_MQTT_BROKER_LOG: /srv/mosquitto-log/mosquitto.log
      # Discovery (nmap, raw capture) is NOT run in this container: it has no
      # capabilities and no nmap binary. A dedicated, minimally privileged
      # capture/enforcement container arrives in Phase 4.
    ports:
      - "127.0.0.1:${DSN_BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - backend-data:/srv/data
      - ../fixtures:/srv/fixtures:ro
      - ./mosquitto/certs/ca.crt:/srv/mqtt-ca.crt:ro
      - mosquitto-log:/srv/mosquitto-log:ro
    # Read access to the broker log (0640 mosquitto:mosquitto; see entrypoint.sh).
    group_add: ["1883"]
    networks: [backplane]
    depends_on:
      neo4j:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DSN_FRONTEND_HOST_PORT:-5173}:8080"
    networks: [backplane]
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backplane: {}

volumes:
  mosquitto-data: {}
  mosquitto-log: {}
  neo4j-data: {}
  backend-data: {}
