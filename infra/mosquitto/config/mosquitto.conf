# Phase 0 baseline: secure-by-default, effectively closed.
# - Anonymous clients are rejected and no password file exists yet, so NO client
#   can connect. This is intentional until Phase 5 adds TLS, per-client
#   credentials, topic ACLs and rate limits.
# - The listener is reachable only on the internal compose network.

listener 1883
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
