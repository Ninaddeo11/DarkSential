# Darknet Sentinel Nexus lab broker (Phase 5).
# Provision certs + credentials first:
#   cd backend && uv run python ../scripts/mqtt_provision.py --host <broker-dns> --ip <broker-ip> \
#       --device esp32-node ...
# Without them Mosquitto refuses to start (fail closed).

per_listener_settings false
allow_anonymous false
# Installed with mosquitto-only permissions by infra/mosquitto/entrypoint.sh.
password_file /mosquitto/secure/passwd
acl_file /mosquitto/secure/acl

# TLS only. No plaintext listener exists.
listener 8883
protocol mqtt
cafile /mosquitto/secure/ca.crt
certfile /mosquitto/secure/server.crt
keyfile /mosquitto/secure/server.key
tls_version tlsv1.2
require_certificate false

# --- Resource limits -----------------------------------------------------------
# Mosquitto 2.0 has no per-client message-rate limit. These cap what one client
# can hold. Connection-rate limiting is done by nftables (broker-ratelimit.nft),
# and floods are detected by DSN (rule mqtt_connect_flood).
max_connections 128
max_keepalive 120
max_packet_size 16384
max_inflight_messages 20
max_queued_messages 200
max_queued_bytes 1048576

persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 7d

# --- Logging -------------------------------------------------------------------
# The file log is tailed by the backend (connect/auth/subscribe/denied events feed
# the behavior pipeline). "subscribe" is required for wildcard-subscription
# detection; "debug" is required for "Denied PUBLISH" lines.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type debug
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
